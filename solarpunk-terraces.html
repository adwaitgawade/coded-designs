<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Solarpunk Terrace Habitat</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #fbfaf2;
      overflow: hidden;
      overscroll-behavior: none
    }

    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none
    }

    #ui {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      padding: 6px 6px 6px 16px;
      border-radius: 999px;
      background: rgba(10, 32, 44, .72);
      color: #f2fbf4;
      font: 600 13px/1.25 system-ui, -apple-system, sans-serif;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: opacity .8s
    }

    #ui.quiet {
      opacity: .32
    }

    #ui.quiet:hover,
    #ui.quiet:focus-within {
      opacity: 1
    }

    #ui button {
      all: unset;
      cursor: pointer;
      flex: none;
      padding: 7px 13px;
      border-radius: 999px;
      background: #c8f06a;
      color: #0c2a2c;
      font: 700 13px/1 system-ui, sans-serif
    }

    #ui button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px
    }
  </style>
</head>

<body>
  <canvas id="c" role="img"
    aria-label="An isometric solarpunk habitat under a glass dome. Terraced tan houses with solar panel roofs are overgrown with ivy and purple flowers, while villagers play the flute, hang laundry and climb stairs among cats, squirrels, pipes, vents and fruit trees."></canvas>
  <div id="ui"><span id="hint">Inking the habitat…</span><button id="btn" type="button">Skip</button></div>
  <script>
    'use strict';
    (() => {
      /* ---------- utilities ---------- */
      const { sin, cos, abs, min, max, hypot, PI, sqrt, exp, floor, ceil, pow, round } = Math, TAU = PI * 2;

      function RNG(s) {

          s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

      const rgb = c => { const n = parseInt(c.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255] };
      const mix = (a, b, t) => {
        const A = rgb(a), B = rgb(b), h = v => round(v).toString(16).padStart(2, '0');

      };
      const hash = (x, y) => { const s = sin(x * 127.1 + y * 311.7) * 43758.5453; return s - floor(s) };

      };

      const wind = (x, T) => sin(T * 1.1 + x * .008) * .6 + sin(T * 2.3 + x * .017) * .25 + sin(T * .37) * .3;

      /* ---------- world lists ---------- */

      const SUN = { x: -420, y: 0 };
      const add = (list, o, fn, st = 3) => { Object.assign(o, { h: 0, was: false, jt: -9, lx: 0, ly: 0, st }); o.draw = T => fn(o, T); list.push(o); if (o.r) hot.push(o); return o };

      /* ---------- foliage ---------- */
      const TN = { ivy: ['#0b4a38', '#178a4a', '#46b84e', '#9fe05a'], deep: ['#08383a', '#0f6a4a', '#2a9a50', '#7ccb58'], lime: ['#1c6a34', '#5ab83e', '#a6dc4e', '#e6f27a'], pine: ['#0a3a44', '#0f5a56', '#1f7a62', '#4fa878'], tree: ['#0d5a3a', '#1f9a4a', '#58c04c', '#b4e660'], dark: ['#0a4034', '#12704a', '#2f9c52', '#6fc45a'] };
