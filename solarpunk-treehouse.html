<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Solarpunk Treehouse Village</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #fbf5e6;
      overflow: hidden;
      overscroll-behavior: none
    }

    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none
    }

    #v {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 3s;
      background: radial-gradient(ellipse at 46% 54%, transparent 55%, rgba(28, 12, 52, .4) 100%)
    }

    #ui {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      padding: 6px 6px 6px 16px;
      border-radius: 999px;
      background: rgba(32, 20, 44, .62);
      color: #fdf1dc;
      font: italic 14px/1.25 Georgia, 'Times New Roman', serif;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: opacity .8s
    }

    #ui.quiet {
      opacity: .32
    }

    #ui.quiet:hover,
    #ui.quiet:focus-within {
      opacity: 1
    }

    #ui button {
      all: unset;
      cursor: pointer;
      flex: none;
      padding: 7px 13px;
      border-radius: 999px;
      background: #fdf1dc;
      color: #3a2340;
      font: 600 13px/1 system-ui, sans-serif
    }

    #ui button:focus-visible {
      outline: 2px solid #ffc978;
      outline-offset: 2px
    }

    @media(max-width:520px) {
      #ui {
        font-size: 12.5px
      }
    }
  </style>
</head>

<body>
  <canvas id="c" role="img"
    aria-label="A Studio Ghibli inspired solarpunk treehouse village at sunset. Wooden platforms, glass domes, windmills and paper lanterns wrap around giant trees, while green lizards, axolotls, a black cat and small ghosts play among them."></canvas>
  <div id="v"></div>
  <div id="ui"><span id="hint">Sketching the village…</span><button id="btn" type="button">Skip</button></div>

      const add = (list, o, fn, st = 4) => { Object.assign(o, { h: 0, was: false, jt: -9, lx: 0, ly: 0, st }); o.draw = T => fn(o, T); list.push(o); if (o.r) hot.push(o); return o };

      /* ---------- clouds, foliage ---------- */
